# tuned/devices/rtx50.conf — static device config for RTX 50 (Blackwell
# consumer, x86_64).
#
# "a" suffix targets the Blackwell family-specific SASS variant -- required
# for RTX 50-specific tensor core instructions not present in the
# compatible/generic sm_120 target (mirrors zbrad/cuvs's tuned/devices/
# rtx50.conf). Ada Lovelace (RTX 40, see tuned/devices/rtx40.conf) has no
# such variant -- bare 89 is correct there.

GPU_TUNED_VARIANT="rtx50"
GPU_TUNED_PLATFORM="x86_64"
GPU_TUNED_CUDA_ARCH="120a"
GPU_TUNED_HW_LABEL="RTX 50-series (Blackwell consumer, desktop/laptop, SM 120a)"

GPU_TUNED_BLAS="mkl"
GPU_TUNED_MKL_ROOT="/opt/intel/oneapi/mkl/latest"
GPU_TUNED_OPT_LEVEL="avx2"
GPU_TUNED_SWIG_TARGETS="swigfaiss swigfaiss_avx2 swigfaiss_avx512"
GPU_TUNED_MAKE_TARGETS="faiss faiss_avx2 faiss_avx512 faiss_c faiss_c_avx2 faiss_c_avx512"

# See tuned/devices/gb10.conf for cuVS wiring (uniform across all variants).

# tuned/devices/gb10.conf — static device config for GB10 (DGX Spark,
# Grace Blackwell, aarch64). See tuned/devices/rtx50.conf for the
# 121a/120a family-specific-suffix rationale.

GPU_TUNED_VARIANT="gb10"
GPU_TUNED_CUDA_ARCH="121a"
GPU_TUNED_HW_LABEL="GB10 / DGX Spark (Grace Blackwell, SM 121)"

# No MKL on aarch64 -- OpenBLAS instead. No AVX2/AVX512 either (x86-only
# SIMD extensions): a single generic SWIG/make target covers this variant.
GPU_TUNED_BLAS="openblas"
GPU_TUNED_OPENBLAS_LIB="/usr/lib/aarch64-linux-gnu/libopenblas.so"
GPU_TUNED_OPT_LEVEL="generic"
GPU_TUNED_SWIG_TARGETS="swigfaiss"
GPU_TUNED_MAKE_TARGETS="faiss faiss_c"

# cuVS wiring (-Dcuvs_DIR=..., -DFAISS_CUVS_GB10_LIBRARY=...) is resolved
# uniformly for all three variants in tuned/build.sh's resolve_cuvs_release
# -- downloads and extracts the matching zbrad/cuvs tuned-builds release
# (see that repo's tuned/package.sh) rather than reaching into a local
# sibling checkout. No per-variant flag needed here anymore.

# tuned/devices/rtx40.conf — static device config for RTX 40 (Ada Lovelace,
# x86_64). See tuned/devices/rtx50.conf for the family-specific-suffix
# rationale (Ada has none -- bare 89 is correct here).

GPU_TUNED_VARIANT="rtx40"
GPU_TUNED_CUDA_ARCH="89"
GPU_TUNED_HW_LABEL="RTX 4080/4090 (Ada Lovelace, SM 89)"

GPU_TUNED_BLAS="mkl"
GPU_TUNED_MKL_ROOT="/opt/intel/oneapi/mkl/latest"
GPU_TUNED_OPT_LEVEL="avx2"
GPU_TUNED_SWIG_TARGETS="swigfaiss swigfaiss_avx2 swigfaiss_avx512"
GPU_TUNED_MAKE_TARGETS="faiss faiss_avx2 faiss_avx512 faiss_c faiss_c_avx2 faiss_c_avx512"

# See tuned/devices/gb10.conf for cuVS wiring (uniform across all variants).
